[project]
name = "wealthos-banking-worker"
version = "1.0.0"
requires-python = ">=3.13"
# Same libraries as backend/requirements.txt, minus the local server (uvicorn).
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.9,<3.0",
    "cryptography>=43",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
]

[dependency-groups]
dev = ["workers-py==1.17.9", "workers-runtime-sdk==1.9.6"]
